testimonials:
  introtext: Testimonials from allies, subordinates, and adversaries regarding the Dark Lord's supremacy
  list:
    - name: Emperor Palpatine
      role: Galactic Emperor & Sith Master
      text: >
        Lord Vader is the ultimate manifestation of the Dark Side's power. His capacity
        to execute the Empire's will with unyielding precision is unmatched. Those who dare
        challenge him shall learn the true meaning of suffering.
      avatar: /att/photo.jpg
      rate: 5
    - name: Grand Moff Tarkin
      role: Governor of the Outer Rim
      text: >
        Working alongside Lord Vader ensures that strategic objectives are met regardless
        of cost. His presence instills a methodical dread that maintains order across even
        the most unruly systems.
      avatar: /att/photo.jpg
      rate: 5
    - name: Admiral Piett
      role: Imperial Fleet Commander
      text: >
        Serving under Lord Vader's direct command demands absolute excellence. Mistakes are
        not tolerated, but under his leadership, the fleet has never suffered a true strategic defeat.
      avatar: /att/photo.jpg
      rate: 5
    - name: Boba Fett
      role: Bounty Hunter
      text: >
        Vader pays on time and keeps his word, as long as you don't disintegrate the targets.
        He is one of the few figures in the galaxy I truly respect and fear.
      avatar: /att/photo.jpg
      rate: 5
    - name: Obi-Wan Kenobi
      role: Jedi Master in Exile
      text: >
        He was the Chosen One, destined to destroy the Sith, not join them. His mastery of
        combat and unrestrained deployment of the Dark Side make him the most dangerous entity in the galaxy.
      avatar: /att/photo.jpg
      rate: 1
    - name: Luke Skywalker
      role: Rebel Alliance Pilot
      text: >
        There is a conflict within him; I can feel it. Yet on the battlefield and inside the cockpit of his starfighter,
        his raw power and tactical mastery are simply overwhelming.
      avatar: /att/photo.jpg
      rate: 4
    - name: Ahsoka Tano
      role: Former Jedi Padawan
      text: >
        The man who was once my master no longer exists; only an unstoppable machine of war remains.
        His lightsaber technique and command over the Force are nearly unassailable.
      avatar: /att/photo.jpg
      rate: 2
    - name: Director Orson Krennic
      role: Director of Advanced Weapons Research
      text: >
        Despite our disagreements regarding leadership over the Death Star project, I must admit
        that his ability to choke out bureaucratic inefficiency is remarkably effective.
      avatar: /att/photo.jpg
      rate: 4


  picture: /att/yosinfondo.webp
  description: |
    I'm a Physics Engineer and Software Developer passionate about mathematical optimization, operations research, physics, and scientific research. My experience spans optimization algorithms for airline crew rostering at LATAM Airlines, research in physics, and developing educational video games that inspire interest in science.

    I enjoy combining mathematical modeling, algorithm design, and software engineering to tackle complex, real-world problems. Having collaborated in international environments, I value interdisciplinary research, continuous learning, and technology that makes a meaningful impact.
  
    I'm always eager to explore new ideas, collaborate across disciplines, and develop innovative solutions that bridge scientific research and practical applications.
